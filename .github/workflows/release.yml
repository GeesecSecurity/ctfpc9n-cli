name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure Go proxy
        run: go env -w GOPROXY=https://goproxy.cn,direct

      - name: Build release assets
        run: make release

      - name: Generate checksums
        run: sha256sum bin/ctfpc9n-cli-* > bin/SHA256SUMS

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if previous_tag="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null)"; then
            printf '## Changes since %s\n\n' "$previous_tag" > RELEASE_NOTES.md
            git log --format='- %h %s' "$previous_tag..$TAG" >> RELEASE_NOTES.md
          else
            printf '## Changes\n\n' > RELEASE_NOTES.md
            git log --format='- %h %s' "$TAG" >> RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" bin/ctfpc9n-cli-* bin/SHA256SUMS --clobber
          else
            gh release create "$TAG" bin/ctfpc9n-cli-* bin/SHA256SUMS --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
